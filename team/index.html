:root{--obsidian:#08070B;--ink:#0E0D12;--sheet:#14121A;--sheet-2:#1B1822;--line:#2A2730;--rule:#3A3644;--hair:#221F29;
  --ivory:#F3EEE3;--muted:#C2BAAC;--faint:#ADA598;--gold:#C9A227;--gold-lit:#E4C55A;--stop:#E0705A;--go:#7FBF8C;--wait:#E0B052;
  --display:"Bodoni Moda","Cormorant Garamond",Georgia,"Times New Roman",serif;--ui:Inter,"Segoe UI",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--obsidian);color:var(--ivory);font-family:var(--ui);font-size:17px;line-height:1.55}
a{color:var(--gold-lit)}
.skip{position:absolute;left:-999px;top:0;background:var(--gold);color:#0b0b0f;padding:.6rem 1rem;z-index:100}
.skip:focus{left:1rem;top:1rem}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold-lit);outline-offset:2px}
.frame{display:grid;grid-template-columns:15.5rem minmax(0,1fr);min-height:100vh}
aside.rail{background:linear-gradient(180deg,#0C0B10,#0A090E);border-right:1px solid var(--line);padding:1.2rem 0 2rem;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:block;padding:0 1.25rem .9rem;font-family:var(--display);font-size:1.55rem;color:var(--ivory);text-decoration:none;border-bottom:1px solid var(--line);margin-bottom:.6rem}
.brand small{display:block;font-family:var(--ui);font-size:.75rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-lit);margin-top:.15rem}
.ver{margin:-.2rem 0 .6rem;padding:0 1.25rem;font-size:.74rem;letter-spacing:.08em;color:var(--wait)}
.rail-g{margin:0;padding:.7rem 1.25rem .2rem;font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.rail a.dest{display:flex;align-items:center;justify-content:space-between;gap:.5rem;min-height:44px;padding:.45rem 1.25rem;color:var(--muted);text-decoration:none;font-size:.98rem;border-left:2px solid transparent}
.rail a.dest:hover{color:var(--ivory);background:var(--sheet)}
.rail a.dest[aria-current="page"]{color:var(--ivory);border-left-color:var(--gold);background:var(--sheet-2)}
.rail a.dest .n{font-size:.8rem;padding:0 .4rem;border:1px solid var(--rule);color:var(--gold-lit);border-radius:0;font-variant-numeric:tabular-nums}
.who{padding:1rem 1.25rem 0;font-size:.88rem;color:var(--faint);display:flex;flex-direction:column;gap:.5rem}
.who button{min-height:44px;padding:.3rem .8rem;background:none;border:1px solid var(--rule);color:var(--muted);font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;align-self:flex-start}
.who button:hover{color:var(--ivory);border-color:var(--gold)}
.rail-pull{display:none;min-height:44px;margin:0;padding:.4rem .9rem;background:none;border:1px solid var(--rule);color:var(--ivory);font-size:.85rem;letter-spacing:.1em;text-transform:uppercase}

/* v32.2: the writing desk */
.wd-body{display:block;width:100%;min-height:60vh;padding:1rem 1.1rem;font:1.05rem/1.7 var(--serif,Georgia,serif);color:var(--ivory,#F3EEE3);background:var(--sheet,#14121A);border:1px solid var(--line,#2a2a33);resize:vertical;white-space:pre-wrap}

.wd-body.script{font:1rem/1.5 "Courier Prime","Courier New",Courier,monospace;white-space:pre-wrap}
.sd-tools{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem;margin:.3rem 0 .6rem}

.sd-elements .fine{flex-basis:100%;margin:.2rem 0 0}
.sd-page{background:#F6F1E7;color:#141217;padding:3rem 3.2rem 3.5rem;border:1px solid var(--line);max-width:46rem;margin:0 auto;font:1.02rem/1.6 var(--serif,Georgia,serif);white-space:pre-wrap;overflow-wrap:anywhere}
.sd-page h1{font-size:1.6rem;margin:0 0 1rem;color:#141217}

.sd-page p{margin:0 0 .9rem}
.sd-page hr{border:0;border-top:1px dashed #b9b0a0;margin:1.6rem 0}
.sd-page.script{font:12pt/1.2 "Courier Prime","Courier New",Courier,monospace;padding:4rem 4.5rem 4rem 5.5rem}
.sd-page.script p{margin:0 0 1.2em;white-space:pre-wrap}
.sd-page.script .sd-title{text-align:center;margin:6rem 0 5rem}
.sd-page.script .sd-title h1{font:inherit;font-weight:700;text-transform:uppercase;text-decoration:underline;margin:0 0 3rem}
.sd-page.script .sd-title p{white-space:pre-wrap}
.sd-page.script .sd-date{margin-top:4rem}
.sd-page.script .sd-scene{font-weight:700;text-transform:uppercase;margin-top:2.4em}
.sd-page.script .sd-action{max-width:100%}
.sd-page.script .sd-character{margin:0 0 0 38%;text-transform:uppercase}

.s.hot{color:var(--gold-lit)}
@media (max-width:640px){.sd-page{padding:1.6rem 1.1rem}.sd-page.script{padding:2rem 1rem 2rem 1.4rem;font-size:10.5pt}.sd-page.script .sd-character{margin-left:30%}.sd-page.script .sd-dialogue{margin:0 8% 1.2em 14%}.sd-page.script .sd-parenthetical{margin-left:22%;width:55%}}
/* v33.1: the rooms of a world */
.cal-day{margin:1rem 0 .2rem;font-family:var(--ui);font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-lit)}
.callsheet{border:1px solid var(--line);background:var(--sheet);padding:.8rem 1.1rem;margin:.4rem 0 .6rem}
.callsheet h4{margin:.7rem 0 .15rem;font-family:var(--ui);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-lit)}
.callsheet h4:first-child{margin-top:0}
.callsheet p{margin:0 0 .3rem;white-space:pre-wrap}
.callsheet ul{margin:0 0 .3rem 1.1rem;padding:0}
.ann-body p{font-size:1.05rem;line-height:1.65;max-width:46rem;white-space:pre-wrap}
.dialog.wide .field{max-width:none}
@media print{body.print-callsheet *{visibility:hidden}body.print-callsheet .callsheet-host,body.print-callsheet .callsheet-host *,body.print-callsheet main h1,body.print-callsheet main p.lede{visibility:visible}body.print-callsheet .callsheet-host{position:absolute;left:0;top:6rem;width:100%;color:#000;background:#fff}body.print-callsheet .callsheet{background:#fff;color:#000;border-color:#000}body.print-callsheet .callsheet h4{color:#000}body.print-callsheet main h1,body.print-callsheet main p.lede{position:absolute;left:0;color:#000;background:#fff}body.print-callsheet main h1{top:0}body.print-callsheet main p.lede{top:3.4rem}}
/* v34: analytics, the canvas */
.chart{display:flex;align-items:flex-end;gap:.5rem;height:180px;padding:.6rem .4rem 1.6rem;border:1px solid var(--line);background:var(--sheet);overflow-x:auto}
.chart-col{position:relative;display:flex;align-items:flex-end;gap:2px;flex:1 0 2.6rem;height:100%}
.chart-bar{flex:1 1 0;min-height:2px;background:var(--gold);opacity:.9}
.chart-bar.k1{background:var(--gold-lit)}
.chart-bar.k2{background:#8fb39a}
.chart-x{position:absolute;left:0;right:0;bottom:-1.4rem;text-align:center;font-family:var(--ui);font-size:.68rem;color:var(--faint);white-space:nowrap}
.chart-key{display:inline-block;padding:.05rem .45rem;margin-right:.4rem;border-left:.7rem solid var(--gold)}
.chart-key.k1{border-color:var(--gold-lit)}
.chart-key.k2{border-color:#8fb39a}
.canvas-board{position:relative;overflow:auto;border:1px solid var(--line);background:repeating-linear-gradient(0deg,transparent 0 23px,rgba(255,255,255,.035) 23px 24px),repeating-linear-gradient(90deg,transparent 0 23px,rgba(255,255,255,.035) 23px 24px),var(--sheet);min-height:520px;margin:.6rem 0}
.canvas-empty{position:absolute;left:1rem;top:1rem}
.canvas-card{position:absolute;padding:.6rem .75rem .5rem;border:1px solid #b9b0a0;box-shadow:2px 3px 0 rgba(0,0,0,.35);cursor:grab;color:#141217;background:#F6F1E7;user-select:none;touch-action:none}
.canvas-card.moving{cursor:grabbing;box-shadow:4px 6px 0 rgba(0,0,0,.45);z-index:5}
.canvas-card.c-gold{background:#E9D28A}.canvas-card.c-rose{background:#E7C2BC}.canvas-card.c-sage{background:#C8D8C2}.canvas-card.c-slate{background:#C9CBD6}
.canvas-card .canvas-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.2rem}
.canvas-card .k{font-family:var(--ui);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:#5a5247}
.canvas-card .canvas-title{display:block;font-family:var(--serif);font-size:1.05rem;line-height:1.3;color:#141217;text-decoration:none}
.canvas-card a.canvas-title:hover{text-decoration:underline}
.canvas-card .canvas-body{margin:.3rem 0 .2rem;font-size:.92rem;line-height:1.45;white-space:pre-wrap;color:#2a2622}
.canvas-card .fine{color:#5a5247;margin:0;font-size:.74rem}
.canvas-card .canvas-x{border:0;background:transparent;color:#5a5247;font-size:1.1rem;line-height:1;padding:0 .2rem;cursor:pointer;min-height:0}
.canvas-card:focus{outline:2px solid var(--gold-lit);outline-offset:2px}

/* v35: the look of the July prototype, on the real portal: obsidian with a purple glow, gold marks, rounded panels,
   icons in the rail, the welcome band, the stat tiles, the big cards. Contrast kept for every word. */
:root{--purple:#4B2E83;--purple-lit:#7A5CE0;--purple-soft:#241A3A;--panel:#131019;--gold-bright:#E4BE45;--emerald:#3FA34D;--ember:#C8372D;--sky:#5B8BD0}
body.look40{background:radial-gradient(1200px 700px at 82% -12%,rgba(75,46,131,.22),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(201,162,39,.08),transparent 55%),#0B0B0F}
body.look40 .rail{background:linear-gradient(180deg,#120F1B,#0B0B0F);border-right:1px solid rgba(201,162,39,.2)}
body.look40 .brand{border-bottom:0;margin-bottom:0;font-size:1.7rem}
body.look40 .brand small{display:block;font-family:var(--mono);font-size:.62rem;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);margin-top:.3rem}
body.look40 .ver{color:var(--faint);font-family:var(--mono);font-size:.66rem;letter-spacing:.06em}
body.look40 .dept-badge{display:flex;align-items:center;gap:.6rem;margin:.5rem .8rem .4rem;padding:.55rem .7rem;border:1px solid rgba(201,162,39,.25);border-radius:10px;background:rgba(75,46,131,.16)}
body.look40 .dept-badge .db-ic{font-size:1.3rem}
body.look40 .dept-badge .db-n{display:block;font-family:var(--display);font-size:1rem;color:var(--ivory);line-height:1.15}
body.look40 .dept-badge .db-r{display:block;font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--purple-lit);margin-top:.15rem}
body.look40 .rail-g{font-family:var(--mono);font-size:.62rem;letter-spacing:.24em;color:var(--faint);padding:.8rem 1.25rem .25rem}
body.look40 .dest{margin:0 .6rem;padding:.42rem .7rem;min-height:40px;border-radius:7px;border-left:0;font-size:.95rem;gap:.6rem;justify-content:flex-start}
body.look40 .dest .ic{width:1.35rem;text-align:center;font-size:1rem;flex:none;opacity:.9}
body.look40 .dest > span:not(.ic):not(.n){flex:1}
body.look40 .dest:hover{background:rgba(255,255,255,.04);color:var(--ivory)}
body.look40 .dest[aria-current=page]{color:var(--ivory);background:rgba(75,46,131,.32);box-shadow:inset 2px 0 0 var(--gold)}
body.look40 .dest .n{border-radius:999px;border-color:rgba(201,162,39,.5);font-family:var(--mono);font-size:.7rem;padding:0 .45rem;background:rgba(201,162,39,.12)}
body.look40 .who{padding:1rem .9rem 0}
body.look40 .me-chip{display:flex;align-items:center;gap:.6rem;border:1px solid rgba(201,162,39,.25);border-radius:999px;padding:.35rem .4rem .35rem .8rem;background:rgba(75,46,131,.14);color:var(--ivory)}
body.look40 .me-chip .mc-n{display:block;font-size:.9rem;line-height:1.15}
body.look40 .me-chip .mc-r{display:block;font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-top:.1rem}
body.look40 .avatar{width:32px;height:32px;border-radius:50%;background:rgba(75,46,131,.5);border:1px solid rgba(201,162,39,.35);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:.85rem;color:var(--ivory);flex:none;margin-left:auto}
body.look40 .who > button{align-self:flex-start;border-radius:8px}
body.look40 .kicker{color:var(--purple-lit);font-family:var(--mono);font-size:.66rem;letter-spacing:.26em}
body.look40 h1{letter-spacing:.01em}
body.look40 .lede{font-size:1rem}
body.look40 .panel,body.look40 .card,body.look40 .kind-sec,body.look40 .cat-filters,body.look40 .callsheet,body.look40 .sd-elements,body.look40 .chart,body.look40 .say{border-radius:12px;background:var(--panel)}
body.look40 .card{padding:1rem 1.1rem;transition:.16s}
body.look40 .card:hover{border-color:rgba(201,162,39,.5);transform:translateY(-1px)}
body.look40 .card.hot{border-color:rgba(201,162,39,.55);background:linear-gradient(135deg,rgba(201,162,39,.1),var(--panel))}
body.look40 .cards.figs .card .k{font-family:var(--mono);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
body.look40 .cards.figs .card .big,body.look40 .cards.needs .card .big{font-family:var(--display);color:var(--gold-bright)}
body.look40 .act{border-radius:8px;letter-spacing:.04em;text-transform:none;font-weight:600}
body.look40 .act.ghost{border-color:rgba(201,162,39,.28)}
body.look40 .act.ghost:hover{background:rgba(75,46,131,.22)}
body.look40 .row{border-bottom:1px solid rgba(244,241,234,.07)}
body.look40 .row .s{font-family:var(--mono);font-size:.66rem;letter-spacing:.14em}
body.look40 .s.hot{color:var(--gold-bright)}
body.look40 .rows{border-top:1px solid rgba(201,162,39,.2)}
body.look40 .dialog{border-radius:14px;background:var(--panel)}
body.look40 input,body.look40 textarea,body.look40 select,body.look40 .field select{border-radius:8px;border-color:rgba(201,162,39,.25)}
body.look40 h2{font-family:var(--display);font-size:1.25rem;margin:1.6rem 0 .5rem;display:flex;align-items:center;gap:.6rem}
/* the welcome band and the tiles */
.word-hero{border:1px solid rgba(201,162,39,.35);background:linear-gradient(135deg,rgba(122,92,224,.16),rgba(201,162,39,.06) 60%,rgba(255,255,255,.02));border-radius:14px;padding:1.2rem 1.5rem;margin:0 0 1rem}
.word-hero.lead{border-color:rgba(122,92,224,.45)}
.word-hero.founder{border-color:rgba(228,190,69,.6);background:linear-gradient(135deg,rgba(201,162,39,.18),rgba(75,46,131,.18))}
.wh-mark{font-family:var(--display);font-size:1.6rem;color:var(--gold);letter-spacing:.02em;line-height:1.15}
.wh-sub{font-size:.95rem;color:var(--muted);margin-top:.4rem;max-width:70ch;line-height:1.5}
.wh-sub b{color:var(--ivory);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.7rem;margin:.4rem 0 1.2rem}
.stat{border:1px solid rgba(201,162,39,.2);border-radius:12px;background:var(--panel);padding:.9rem 1rem;color:inherit;text-decoration:none;display:block}
.stat.click:hover{border-color:rgba(201,162,39,.5)}
.stat .v{font-family:var(--display);font-size:1.7rem;color:var(--gold-bright);line-height:1}
.stat .l{font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:.4rem}
.bigcard-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.8rem;margin:.4rem 0 .8rem}
.big-card{border:1px solid rgba(201,162,39,.2);border-radius:14px;padding:1.05rem 1.2rem;background:rgba(255,255,255,.02);display:flex;flex-direction:column;color:inherit;text-decoration:none;min-height:120px;transition:.16s}
.big-card:hover{transform:translateY(-1px);background:rgba(255,255,255,.04)}
.big-card.tone-purple{border-color:rgba(122,92,224,.5)}.big-card.tone-gold{border-color:rgba(198,160,74,.55)}.big-card.tone-green{border-color:rgba(63,163,77,.5)}.big-card.tone-blue{border-color:rgba(91,139,208,.5)}.big-card.tone-rose{border-color:rgba(200,55,45,.45)}
.bc-top{display:flex;justify-content:space-between;align-items:center;gap:.6rem}
.bc-title{font-size:1.1rem;color:var(--ivory);font-weight:600;line-height:1.2}
.bc-sub{font-size:.9rem;color:var(--muted);margin:.45rem 0 .6rem;line-height:1.45;flex:1}
.bc-cta{font-family:var(--mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.pill{display:inline-block;font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:.15rem .6rem;border:1px solid rgba(201,162,39,.2);color:var(--muted);white-space:nowrap}
.pill.gold{color:var(--gold);border-color:rgba(201,162,39,.5)}.pill.green{color:#7fd48b;border-color:rgba(63,163,77,.5)}.pill.faint{opacity:.7}.pill.hot{color:#ffb3ad;border-color:rgba(200,55,45,.5)}
.film-chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.3rem 0 .6rem}
.chip{display:inline-block;font-size:.8rem;color:var(--muted);border:1px solid rgba(244,241,234,.1);border-radius:999px;padding:.2rem .7rem;text-decoration:none}
.chip.link:hover{color:var(--ivory);border-color:rgba(201,162,39,.5)}
/* signals */
.sg-tabs{display:flex;gap:.4rem;margin:.2rem 0 .8rem}
.sg-tab{border:1px solid rgba(201,162,39,.2);border-radius:999px;padding:.3rem .9rem;font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:transparent;cursor:pointer}
.sg-tab.on{color:var(--ivory);background:rgba(75,46,131,.32);border-color:rgba(122,92,224,.6)}
.sg-list{display:flex;flex-direction:column;gap:.5rem}
.sg{border:1px solid rgba(201,162,39,.2);border-radius:10px;background:var(--panel);padding:.7rem .9rem;cursor:pointer;color:inherit;text-decoration:none;display:block;transition:.12s}
.sg:hover{border-color:rgba(201,162,39,.5)}
.sg.unread{border-color:rgba(228,190,69,.45);background:linear-gradient(135deg,rgba(201,162,39,.08),var(--panel))}
.sg-top{display:flex;justify-content:space-between;gap:.6rem;font-size:.8rem;color:var(--muted)}
.sg-who{color:var(--ivory)}
.sg-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold-bright);margin-right:.4rem;vertical-align:middle}
.sg-dt{font-family:var(--mono);font-size:.68rem;white-space:nowrap}
.sg-sub{font-family:var(--display);font-size:1.05rem;color:var(--ivory);margin:.2rem 0 .1rem}
.sg-pre{font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg-body{white-space:pre-wrap;line-height:1.6;margin:.6rem 0 0;font-size:1rem}
.sg-state{font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
/* the founder view */
.fv-world{display:grid;grid-template-columns:5rem minmax(0,1fr) auto;gap:.4rem 1rem;align-items:center;padding:.7rem 0;border-bottom:1px solid rgba(244,241,234,.07)}
.fv-world .door{font-family:var(--mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.fv-world .nm{font-family:var(--display);font-size:1.15rem;color:var(--ivory)}
.fv-world .m{font-size:.85rem;color:var(--muted)}
.fv-world .acts{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:flex-end}
.fv-world.sealed .nm{color:var(--muted)}
.fv-look{border:1px solid rgba(228,190,69,.45);border-radius:14px;padding:1rem 1.2rem;margin:1rem 0;background:rgba(201,162,39,.06)}
@media (max-width:640px){.fv-world{grid-template-columns:4rem minmax(0,1fr)}.fv-world .acts{grid-column:1 / -1;justify-content:flex-start}.wh-mark{font-size:1.3rem}}
@media print{.word-hero,.stats{display:none}}
/* v36: the deadline band, the month grid, bigger labels, the rail folds, the demo bars on a phone */
.deadline-band{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.2rem 1rem;align-items:center;margin:0 0 1rem;padding:.9rem 1.2rem;border:2px solid var(--gold-bright);border-radius:14px;background:linear-gradient(135deg,rgba(228,190,69,.18),rgba(75,46,131,.18));color:var(--ivory);text-decoration:none}

.deadline-band .dl-k{grid-column:1 / -1;font-family:var(--mono);font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-bright)}
.deadline-band .dl-title{font-family:var(--display);font-size:1.45rem;font-weight:700;line-height:1.15}
.deadline-band .dl-count{font-family:var(--display);font-size:1.6rem;font-weight:700;color:var(--gold-bright);text-align:right;white-space:nowrap}

.cal-head{display:flex;align-items:center;gap:.5rem;margin:.4rem 0 .5rem}
.cal-month{font-family:var(--display);font-size:1.3rem;color:var(--ivory);margin:0 .4rem}
.act.small{min-height:2.1rem;padding:.2rem .7rem}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-dow{font-family:var(--mono);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);text-align:center;padding:.3rem 0}
.cal-cell{position:relative;min-height:6.2rem;border:1px solid rgba(201,162,39,.16);border-radius:8px;background:var(--panel);padding:1.5rem .35rem .3rem}
.cal-cell.empty{background:transparent;border-color:transparent}

.cal-ev{display:block;font-size:.72rem;line-height:1.25;padding:.15rem .35rem;margin:.15rem 0;border-radius:5px;background:rgba(122,92,224,.2);border-left:3px solid var(--purple-lit);color:var(--ivory);text-decoration:none;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cal-ev b{font-weight:600;color:var(--muted)}
.cal-ev.k-deadline{background:rgba(228,190,69,.18);border-left-color:var(--gold-bright);font-weight:600}
.cal-ev.k-shoot{background:rgba(75,46,131,.35);border-left-color:#B39DFF}
.cal-ev.k-screening{border-left-color:#8fb39a;background:rgba(63,163,77,.15)}

<body>
<a class="skip" href="#main" id="skip">Skip to the content</a>
<button class="rail-pull" id="railpull" type="button" aria-expanded="false" aria-controls="rail">Menu</button>
<div class="frame">
  <aside class="rail" id="rail" aria-label="Sections">
    <a class="brand" href="#/home">House of Worlds<small>Team Portal</small></a>
    <p class="ver">Version 36.0</p>

  </aside>
  <main id="main" tabindex="-1"></main>
</div>
<div id="status" role="status" aria-live="polite"></div>

<script>
/* ---------------------------------------------------------------------
   House of Worlds - Team Portal v36.0 (4 October 2026)
   One file, on the live House. A member signs in with the House's own
   sign-in service; what they see afterwards is decided by the House's
   records (Database Steps 28-38: house_team_* functions), never by this page.
   The desk is work-first: what needs the member, their work by where it
   stands, the assignments the Founder placed with them, and her decisions.
   v32: sixteen kinds of work drawn from the House's record of each kind
   (its sections, stages, handoffs, checklist, retained record), handoffs
   to the nineteen shared services with a queue for the members scoped to
   them, the rooms behind each open door, and the one-line email notices
   the House sends when work is returned, decided, handed or assigned.
   v33: the team lead opens on an Overview of the worlds they lead,
   counted from the record (Step 47); the Story Desk writes scripts in
   the plain screenplay convention and lays them out as script pages.
   A piece of work is a draft until it has a source and is submitted to the
   team lead; the team lead recommends, returns, blocks or abstains; a
   recommendation becomes a packet in the Founder's queue, in her dashboard.
   The Founder has no desk here: her account is refused at the threshold.
   A world under seal is named only to a member the House scoped to it.
   This file holds no example record, no Founder function, no sealed name
   and no secret key. Built on the client portal v5.10's threshold,
   connection rules, dialog, rail and styles.
   --------------------------------------------------------------------- */
(function (){
"use strict";

/* ---- storage that degrades ---- */
var MEM = {};
var STORE = (function (){
  function probe(s){ try { var k = "how.probe." + Math.random(); s.setItem(k, "1"); s.removeItem(k); return s; } catch (e) { return null; } }
  var s = probe(window.localStorage) || probe(window.sessionStorage);
  return {
    kind: s === window.localStorage ? "this browser" : s === window.sessionStorage ? "this tab" : "this page only",
    get: function (k){ try { return s ? s.getItem(k) : (MEM[k] || null); } catch (e) { return MEM[k] || null; } },
    set: function (k, v){ try { if (s) s.setItem(k, v); else MEM[k] = v; } catch (e) { MEM[k] = v; } },
    del: function (k){ try { if (s) s.removeItem(k); } catch (e) {} delete MEM[k]; }
  };
})();
var CFG_KEY = "how.team.config.v1", SES_KEY = "how.team.session.v1";

/* ---- small helpers ---- */
function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = String(text); return e; }
function say(kind, head, body){ var d = el("div", "say " + (kind || "")); if (kind === "busy") d.setAttribute("aria-busy", "true"); d.appendChild(el("b", null, head)); d.appendChild(el("span", null, body || "")); return d; }
function field(host, label, id, type, value, rows){
  var w = el("label", "field"); w.appendChild(el("span", null, label));
  var i = rows ? document.createElement("textarea") : document.createElement("input");
  if (!rows) i.type = type || "text"; else i.rows = rows;
  i.id = id; i.value = value == null ? "" : String(value);
  w.appendChild(i); host.appendChild(w); return i;
}
function select(host, label, id, options, value){
  var w = el("label", "field"); w.appendChild(el("span", null, label));
  var s = document.createElement("select"); s.id = id;
  options.forEach(function (o){ var op = document.createElement("option"); op.value = o[0]; op.textContent = o[1]; if (String(o[0]) === String(value)) op.selected = true; s.appendChild(op); });
  w.appendChild(s); host.appendChild(w); return s;
}
function pad(n){ return n < 10 ? "0" + n : String(n); }
function money(cents, cur){
  if (cents == null || isNaN(Number(cents))) return "—";
  try { return new Intl.NumberFormat(undefined, { style:"currency", currency:cur || "USD" }).format(Number(cents) / 100); }
  catch (e) { return (Number(cents) / 100).toFixed(2) + " " + (cur || ""); }
}
/* A date with no time ("2026-09-20") is a calendar day, not an instant. Read as an instant it lands on the evening
   before in any zone west of Greenwich, so it is built from its own numbers, in the viewer's zone. */
function dayOnly(v){ var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v == null ? "" : v)); return m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])) : null; }
function today(){ var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function dayKey(v){ var s = String(v == null ? "" : v); if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s; var d = new Date(s); return isNaN(d) ? "" : d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function isPastDay(v){ var k = dayKey(v); return !!k && k < today(); }      /* strictly before today: due today is not overdue */
function isToday(v){ return dayKey(v) === today(); }
function when(v){
  if (!v) return "—";
  var d = dayOnly(v) || new Date(v); if (isNaN(d)) return String(v);
  return d.toLocaleDateString(undefined, { year:"numeric", month:"short", day:"numeric" });
}
function whenAt(v, houseZone){
  if (!v) return "—";
  var d = new Date(v); if (isNaN(d)) return String(v);
  var mine = d.toLocaleString(undefined, { weekday:"short", year:"numeric", month:"short", day:"numeric", hour:"numeric", minute:"2-digit", timeZoneName:"short" });
  if (!houseZone) return mine;
  try {
    var o = { weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit", timeZoneName:"short" };
    var mineShort = d.toLocaleString(undefined, o);
    o.timeZone = houseZone;
    var theirs = d.toLocaleString(undefined, o);
    /* one line when the viewer and the House keep the same clock; both when they differ */
    return theirs === mineShort ? mine + " (your time, and the House's)" : mine + " your time · " + theirs + " at the House";
  } catch (e) { return mine; }
}
function words(s){ s = String(s || "").replace(/_/g, " "); return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
function bytes(n){ n = Number(n); if (!n) return null; return n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB"; }
function status(text, keep){
  var s = document.getElementById("status"); s.textContent = text || ""; s.className = text ? "on" : "";
  document.body.classList.toggle("status-on", !!text);
  if (text && !keep) setTimeout(function (){ if (s.textContent === text) { s.textContent = ""; s.className = ""; document.body.classList.remove("status-on"); } }, 8000);
}

/* ---- one dialog, accessible: labelled, focus kept inside, Escape closes, focus returns ---- */
function dialog(title, build){
  var opener = document.activeElement;
  var back = el("div", "dialog-back"); var box = el("div", "dialog");
  box.setAttribute("role", "dialog"); box.setAttribute("aria-modal", "true");
  var hid = "dlg-" + Date.now(); var h = el("h2", null, title); h.id = hid; box.setAttribute("aria-labelledby", hid); box.appendChild(h);
  var closed = false, frame = document.querySelector(".frame");
  function close(){ if (closed) return; closed = true; document.removeEventListener("keydown", key, true); back.remove(); try { if (frame) frame.inert = false; } catch (e) {} try { if (opener && opener.focus) opener.focus(); } catch (e) {} }
  function key(e){
    if (e.key === "Escape") { e.preventDefault(); close(); return; }
    if (e.key !== "Tab") return;
    var f = box.querySelectorAll('button:not([disabled]), textarea, input, select, a[href]'); if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    else if (!box.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
  }
  document.addEventListener("keydown", key, true);
  back.addEventListener("mousedown", function (e){ if (e.target === back) close(); });
  back.appendChild(box); document.body.appendChild(back);
  try { if (frame) frame.inert = true; } catch (e) {}
  build(box, close);
  var first = box.querySelector('textarea, input, select, button');
  if (first) first.focus();
  return close;
}
function ask(o){
  return new Promise(function (resolve){
    var answered = false;
    dialog(o.head || "Are you sure?", function (box, close){
      if (o.body) box.appendChild(el("p", "p", o.body));
      var ta = o.reason ? field(box, o.reason, "ask-reason", "text", "", 3) : null;
      var said = el("div");
      var acts = el("div", "actions");
      var yes = el("button", "act" + (o.grave ? " danger" : ""), o.yes || "Yes"); yes.type = "button";
      var no = el("button", "act ghost", o.no || "Not now"); no.type = "button";
      acts.appendChild(yes); acts.appendChild(no); box.appendChild(acts); box.appendChild(said);
      if (o.fine) box.appendChild(el("p", "fine", o.fine));
      yes.addEventListener("click", function (){
        if (o.reasonRequired && ta && ta.value.trim().length < (o.minLength || 1)) { said.replaceChildren(say("no", "A note is needed", o.reasonHint || "Write a few words first.")); ta.focus(); return; }
        answered = true; close(); resolve({ ok:true, note: ta ? ta.value.trim() : "" });
      });
      no.addEventListener("click", function (){ answered = true; close(); resolve({ ok:false }); });
      var obs = new MutationObserver(function (){ if (!document.body.contains(box) && !answered) { answered = true; resolve({ ok:false }); obs.disconnect(); } });
      obs.observe(document.body, { childList:true });
    });
  });
}

/* ---- the connection: never asked of a member ---- */
function normaliseUrl(v){
  v = String(v || "").trim(); if (!v) return "";
  if (!/^https?:\/\//i.test(v)) v = "https://" + v;
  v = v.replace(/\/+$/, "");
  var m = v.match(/^https:\/\/([a-z0-9-]+)\.supabase\.co/i);
  return m ? "https://" + m[1].toLowerCase() + ".supabase.co" : v;
}
function keyProblem(k){
  k = String(k || "").trim();
  if (!k) return "No publishable key.";
  if (/^sb_secret_/i.test(k) || /service_role/i.test(k)) return "That is a secret key. This page refuses it.";
  if (!/^sb_publishable_/i.test(k) && !/^eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/.test(k)) return "That does not look like a publishable key.";
  if (/^eyJ/.test(k)) { try { var p = JSON.parse(atob(k.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))); if (p.role && p.role !== "anon") return "That key carries the role “" + p.role + "”. Only the anon (publishable) key belongs in a browser."; } catch (e) {} }
  return null;
}
function validConfig(c){
  if (!(c && c.url && c.anonKey && /^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(normaliseUrl(c.url)) && !keyProblem(c.anonKey))) return null;
  var out = { url:normaliseUrl(c.url), anonKey:String(c.anonKey).trim() };
  /* v5.3: two optional, public things the House may add: its address, and its public page */
  if (c.contact && /^[^@\s<>]+@[^@\s<>]+\.[^@\s<>]+$/.test(String(c.contact))) out.contact = String(c.contact).trim();
  if (c.house && /^https:\/\/[^\s<>"']+$/.test(String(c.house))) out.house = String(c.house).trim();
  if (c.client && /^https:\/\/[^\s<>"']+$/.test(String(c.client))) out.client = String(c.client).trim();
  return out;
}
function embeddedConfig(){ try { return validConfig(JSON.parse(document.getElementById("how-team-config").textContent || "{}")); } catch (e) { return null; } }
function storedConfig(){ try { return validConfig(JSON.parse(STORE.get(CFG_KEY) || "null")); } catch (e) { return null; } }
function hashParams(){ var h = String(location.hash || "").replace(/^#/, ""); var out = {}; if (h.indexOf("=") < 0 || h.charAt(0) === "/") return out; h.split("&").forEach(function (kv){ var i = kv.indexOf("="); if (i > 0) out[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1).replace(/\+/g, " ")); }); return out; }
function linkConfig(p){
  if (!p.connect) return null;
  try { var b64 = p.connect.replace(/-/g, "+").replace(/_/g, "/"); while (b64.length % 4) b64 += "="; return validConfig(JSON.parse(decodeURIComponent(escape(atob(b64))))); } catch (e) { return null; }
}

/* ---- the smallest client ---- */
var CFG = null, SESSION = null, ME = null, OV = null, PORTAL = null;
var ALLOWED = /^(house_team_[a-z_]+|house_my_assignments|house_assignment_act|house_assignment_actions|house_assignment_transitions|house_source_upload_begin|house_source_upload_finalize|house_client_me|house_public_doors|house_public_rooms|house_founder_eyes_people|house_founder_through_eyes)$/;

function headers(auth, json){
  var h = { "apikey": CFG.anonKey, "X-Client-Info": "house-of-worlds-team-portal/36.0" };
  if (json !== false) h["Content-Type"] = "application/json";
  if (auth && SESSION && SESSION.access_token) h["Authorization"] = "Bearer " + SESSION.access_token;
  return h;
}
function explain(e, st){
  if (st === 0 || (e && /Failed to fetch|NetworkError|Load failed/i.test(String(e.message || e)))) return "The network could not reach the House. Check the connection, then try again.";
  if (st === 401) return "The sign-in is no longer valid. Sign in again.";
  if (st === 403) return "The House refused that for this account.";
  if (st === 404) return "This part of the portal is not available yet. Tell the House if you were expecting it.";
  if (st === 429) return "Too many tries in a short time. Wait a minute and try again.";
  return (e && (e.message || e.msg || e.error_description)) ? String(e.message || e.msg || e.error_description) : "The House did not answer.";
}
function authCall(method, path, body, auth){
  return fetch(CFG.url + path, { method:method, headers:headers(!!auth), body: body ? JSON.stringify(body) : undefined })
    .then(function (r){ return r.text().then(function (t){ var j = {}; try { j = t ? JSON.parse(t) : {}; } catch (e) {} if (!r.ok) throw { message: j.msg || j.error_description || j.error || ("HTTP " + r.status), status:r.status }; return j; }); });
}
var ASK_PREFILL = null;
/* v5.4: a shared device keeps nothing after the tab closes; any device signs out after thirty minutes without a touch. */
var SHARED = (function (){ try { return sessionStorage.getItem("how.team.shared") === "1"; } catch (e) { return false; } })();
var LAST_TOUCH = Date.now();
["click", "keydown", "scroll", "touchstart", "pointerdown"].forEach(function (ev){ document.addEventListener(ev, function (){ LAST_TOUCH = Date.now(); }, { passive:true }); });
setInterval(function (){
  var limit = SHARED ? 15 : 30;
  if (SESSION && ME && Date.now() - LAST_TOUCH > limit * 60000) {
    saveSession(null); ME = null; OV = null; PORTAL = null;
    signInPanel("You were signed out after " + limit + " minutes without a touch. Sign in again; nothing was lost.");
  }
}, 60000);
window.addEventListener("pagehide", function (){ if (SHARED) { try { STORE.del(SES_KEY); } catch (e) {} } });
/* A reply or a decision that arrives while the page is open is announced, in one line, when the page is looked at again. */
document.addEventListener("visibilitychange", function (){
  if (document.visibilityState !== "visible" || !SESSION || !ME || !OV) return;
  var before = JSON.stringify(OV.needs || {});
  refreshOverview().then(function (){
    if (JSON.stringify((OV && OV.needs) || {}) !== before) { status("Something new has arrived. Home shows it, and the counts in the rail are current."); try { paintNav(String(location.hash || "").replace(/^#\/?/, "").split("/")[0]); } catch (e) {} }
  });
});
function saveSession(s){
  SESSION = s ? { access_token:s.access_token, refresh_token:s.refresh_token, expires_at:s.expires_at || (Math.floor(Date.now() / 1000) + (Number(s.expires_in) || 3600)), user:s.user || (SESSION && SESSION.user) || null } : null;
  if (SESSION) STORE.set(SES_KEY, JSON.stringify(SESSION)); else STORE.del(SES_KEY);
}
function loadSession(){ try { SESSION = JSON.parse(STORE.get(SES_KEY) || "null"); } catch (e) { SESSION = null; } }
function fresh(){
  if (!SESSION) return Promise.resolve(false);
  if (SESSION.expires_at - 60 > Math.floor(Date.now() / 1000)) return Promise.resolve(true);
  if (!SESSION.refresh_token) { saveSession(null); return Promise.resolve(false); }
  return authCall("POST", "/auth/v1/token?grant_type=refresh_token", { refresh_token:SESSION.refresh_token })
    .then(function (j){ saveSession(j); return true; }).catch(function (){ saveSession(null); return false; });
}
function rpc(name, args){
  if (!ALLOWED.test(name)) return Promise.resolve({ ok:false, why:"That is not something this portal asks the House for." });
  var needsAuth = /^(house_team_|house_my_|house_assignment_|house_source_|house_client_me|house_founder_)/.test(name);
  return (needsAuth ? fresh() : Promise.resolve(true)).then(function (ok){
    if (!ok) return { ok:false, signedOut:true, why:"Sign in first." };
    return fetch(CFG.url + "/rest/v1/rpc/" + name, { method:"POST", headers:headers(needsAuth), body:JSON.stringify(args || {}) })
      .then(function (r){
        return r.text().then(function (t){
          var j = null; try { j = t ? JSON.parse(t) : null; } catch (e) { j = null; }
          if (!r.ok) return { ok:false, status:r.status, signedOut:r.status === 401, why:explain(j || {}, r.status) };
          if (j === null || typeof j !== "object") return { ok:false, why:"The House's answer could not be read. Try again; if it continues, tell the House." };
          return { ok:true, data:j };
        });
      }).catch(function (e){ return { ok:false, why:explain(e, 0) }; });
  });
}
function act(name, args){
  return rpc(name, args).then(function (r){
    if (!r.ok) return { ok:false, say:r.why, signedOut:r.signedOut };
    if (r.data && r.data.ok === false) return { ok:false, say:r.data.say || "Refused.", stale:r.data.stale };
    return { ok:true, say:(r.data && r.data.say) || "Done.", data:r.data };
  });
}

/* ---- the threshold ---- */
var main = document.getElementById("main"), nav = document.getElementById("nav"), who = document.getElementById("who"), rail = document.getElementById("rail");
document.getElementById("railpull").addEventListener("click", function (){ rail.classList.toggle("open"); this.setAttribute("aria-expanded", rail.classList.contains("open") ? "true" : "false"); });
document.addEventListener("keydown", function (e){ if (e.key === "Escape" && rail.classList.contains("open")) { rail.classList.remove("open"); var b = document.getElementById("railpull"); b.setAttribute("aria-expanded", "false"); b.focus(); } });
function outside(){ nav.replaceChildren(); who.replaceChildren(); rail.classList.remove("open"); try { document.getElementById("railpull").hidden = true; } catch (e) {} }
function password(host, label, id, autocomplete){
  var pw = el("label", "field reveal"); pw.appendChild(el("span", null, label));
  var input = document.createElement("input"); input.type = "password"; input.id = id; input.autocomplete = autocomplete; pw.appendChild(input);
  var eye = el("button", "eye", "Show"); eye.type = "button"; eye.setAttribute("aria-pressed", "false"); eye.setAttribute("aria-label", "Show the password");
  eye.addEventListener("click", function (){ var on = input.type === "password"; input.type = on ? "text" : "password"; eye.textContent = on ? "Hide" : "Show"; eye.setAttribute("aria-pressed", on ? "true" : "false"); eye.setAttribute("aria-label", on ? "Hide the password" : "Show the password"); });
  pw.appendChild(eye); host.appendChild(pw); return input;
}
function noConnection(){
  outside();
  var box = el("section", "entrance");
  box.appendChild(el("p", "kicker", "The threshold"));
  box.appendChild(el("h1", null, "Open this from your invitation"));
  box.appendChild(el("p", "lede", "This page opens from the link in the invitation the House sent you. Open that email and use its link. If the link has gone missing, write to the House and a new one will be sent."));
  box.appendChild(el("p", "fine", "You are never asked for a technical address or a key. If you are seeing this after using the House's link, the House needs to check how this page is hosted."));
  outsideFoot(box);
  document.title = "Open this from your invitation — House of Worlds";
  main.replaceChildren(box);
}
function signInPanel(message, kind){
  outside();
  var box = el("section", "entrance");
  box.appendChild(el("p", "kicker", "The threshold"));
  box.appendChild(el("h1", null, "Sign in"));
  box.appendChild(el("p", "lede", "Use the email address the House invited. What you see afterwards is decided by the House's records, not by this page."));
  if (message) box.appendChild(say(kind || "ask", kind === "no" ? "That did not work" : "Before you begin", message));
  var email = field(box, "Email address", "s-email", "email", ""); email.autocomplete = "username";
  var pass = password(box, "Password", "s-pass", "current-password");
  var said = el("div"); said.setAttribute("aria-live", "polite"); var acts = el("div", "actions");
  var go = el("button", "act", "Enter the House"); go.type = "button";
  function submit(){
    if (!email.value.trim() || !pass.value) { said.replaceChildren(say("no", "Both are needed", "Enter the email address and the password.")); return; }
    go.disabled = true; said.replaceChildren(say("busy", "Signing in", "Asking the House…"));
    authCall("POST", "/auth/v1/token?grant_type=password", { email:email.value.trim(), password:pass.value }).then(function (j){ saveSession(j); pass.value = ""; enter(); })
      .catch(function (e){ go.disabled = false; said.replaceChildren(say("no", "Not signed in", /invalid/i.test(String(e.message)) ? "The email or password is not right." : explain(e, e.status || 0))); });
  }

var HELP = [
  ["Your desk", "Everything on your desk is read from the House when the page opens it. What needs you is counted from the record: work returned to you, drafts not yet submitted, assignments offered to you and, for a team lead, work waiting for review. A figure that could not be read is never shown as zero."],
  ["A piece of work", "Work begins as a draft, in your name, inside a world that is open to you. Every save is a new version and every version is kept; any two can be compared side by side. A draft needs at least one source before it can go anywhere."],
  ["Sources", "A source is a file placed in the House's private store, or a link. For a file, the House records its name, size and fingerprint before the bytes are sent and confirms their size when they arrive; every version is kept beside the earlier ones. Whoever opens a file is on the record. The House has no virus scanner connected yet, so a file says it has not been scanned, and the page asks before opening it."],
  ["The team lead", "Submitting sends the work to the team lead for its world. Nobody reviews their own work. The team lead recommends it, returns it with a review, blocks it with a reason, or abstains with a note; the review is kept with the work and you can read it."],
  ["The Founder", "A recommendation becomes a packet in the Founder's queue, in her dashboard. The Founder is not in this portal: she reads the packet there and her decision, with her reason, comes back to the work's record and to your Decisions page."],
  ["Assignments", "The Founder can place work with you from her dashboard. Only you can accept it, and the record shows who agreed and when. From there: start, update progress, mark blocked, ask for help, and submit with evidence of what was done."],
  ["Roles and Functions", "A private catalog of every kind of work the House may need, in fifteen groups. A title is a definition, with its deliverables and collaborators; it is not a vacancy, a hire, a pay rate or a permission. Proposed means the Founder has not yet approved the definition; approved means she has. Search it by name, discipline, deliverable, department or world."],
  ["Departments and Handoffs", "Nineteen shared services, each with its purpose and when to involve it, the departments of the open worlds, and the ten stages of the House's work: Research, Learn, Develop, Create, Produce, Experience, Publish, Archive, Preserve, Innovate. A piece of work carries its stage."],
  ["People and Credits", "The colleagues who hold a role, the functions they fill, and their confirmed credits. A proposed title is not a person. A person can hold several functions and carry different credits on different projects without being two people."],
  ["Worlds under seal", "Four worlds are open. The others are under seal; a sealed world is named to you only if the House has scoped you to it, and it is never to be named outside the House. The catalog, the search, the counts and the colleagues' records keep the same rule."],
  ["Workspaces", "Seventeen kinds of work (Storyboard and Writing among them), each with its own sections and fields, the stages it passes through, the shared services it usually hands to and when, a checklist before it leaves a stage, and the record the House retains: productions, the House's side of a commission, rights and licensing, partnerships and grants, research and learning, Journal and press, archive and preservation, finance and operations, digital product and trust, people operations, and the plain kinds. Every kind runs on the one engine; the kind only changes what the record asks for. A confidential kind is read by its maker, its owner, the team lead and the service it is handed to."],
  ["Shared services and handoffs", "A piece of work is handed to a shared service from its own page: a request on the record, with what you need. The members the Founder scoped to that service see it in their Service queue, accept it, mark it done with an answer, or decline with why; the work itself stays yours. A service listed as proposed is not yet staffed, and a handoff to it waits on the record."],
  ["Signals", "Signals is the House's email. What the House tells you (work returned, decided, handed, assigned; a calendar event; an announcement) lands in your Signals inbox and in your email. You write a signal to a colleague in your worlds, to your team lead, or to the Founder; it goes out as an email from the House and stays on the record, with read and unread."],
  ["The Founder's view", "The Founder has no desk here and nothing is written as her. Signed in with her own account and her second factor, she sees every team portal read-only: each world, each member, and what that member's own portal shows them, read as the House answers them. Every look is on the record."],
  ["Signals", "Signals is the House's email. What the House tells you (work returned, decided, handed, assigned; a calendar event; an announcement) lands in your Signals inbox and in your email. You write a signal to a colleague in your worlds, to your team lead, or to the Founder; it goes out as an email from the House and stays on the record, with read and unread."],
  ["The Founder's view", "The Founder has no desk here and nothing is written as her. Signed in with her own account and her second factor, she sees every team portal read-only: each world, each member, and what that member's own portal shows them, read as the House answers them. Every look is on the record."],
  ["Pay, time off and your record","Pay is a record the Founder sets from her dashboard; you alone read yours, a team lead sees no pay, and the House runs no payroll and keeps no bank account, tax number or benefit detail. A pay statement is a file she places for you. Time off is asked against a world; its team lead decides, or the Founder when a lead asks; everyone is told by email. My record shows what the House keeps about your work here; the emergency contact is yours to set."],
  ["Travel", "A trip is proposed against a world; its team lead approves it and keeps the itinerary; travellers are asked and tick their readiness; an expense with its receipt is money and reaches the Founder only, who accepts, declines or marks it paid. No travel card provider is connected to the House."],
  ["Craft rooms, the canvas, the archive, analytics", "A craft room is drawn from the record: the people whose positions or roles match the craft, the work in its departments, and a notes board. The world canvas is a board of cards a world shares: notes, links, pieces of work. The archive is what a world has finished, by year, with the handoff to Archives. Analytics are counted from the record: a team lead sees the world's figures, a member their own."],
  ["The calendar and call sheets", "The calendar of the worlds open to you: meetings, shoot days, deadlines, screenings, rehearsals. The team lead of a world puts events on it and asks people to them; each person asked is told by the House's one-line email, and told again if it changes or is cancelled. A shoot day carries its call sheet (general call, location, scenes, cast and crew called, contacts, safety, notes), which prints from the event's page."],
  ["Announcements", "A team lead posts to the world they lead; a lead for every world may post to all. An announcement is read on the desk and may also go out by the House's one-line email. It can be pinned, retracted by its poster or the lead, and given a date after which it is no longer shown. Nothing here is the Founder's decision."],
  ["The House Drive", "Files that belong to a world rather than to one piece of work: reference, boards, agreements, stills. Anyone with a role in the world places a file and reads the world's files; the House records name, size and fingerprint before the bytes arrive and confirms their size after; every opening is on the record; a file is archived by the person who placed it or the lead. Nothing is scanned until a scanner is connected, and the portal says so."],
  ["The team lead's overview", "A team lead opens on one page for the worlds they lead: what waits on them (colleagues' work to review, client requests unread, handoffs in a queue they serve, work past due or blocked), where the world's work stands, the Story Desk, the team and its load, the Founder's decisions in the world, and what the House told them lately. Every figure is counted from the record when the page opens; a member who leads no world is told the page is the team lead's."],
  ["The Story Desk", "A desk for writing itself: a screenplay, a pilot, a treatment, a pitch, a chapter, notes. A script is written in the plain screenplay convention (INT. or EXT. begins a scene heading, a name in capitals on its own line is a character, the lines beneath are their speech, a line ending in TO: is a transition) and the page view lays it out as a script page; it downloads as a .fountain file that screenwriting programs open. Plain text, saved every minute while you type and whenever you press Save, every version kept, any two versions comparable. A piece travels the same path as any work: a draft, the team lead, the Founder. The text is its own source. A team lead's own piece goes straight to the Founder."],
  ["Client requests", "A client who writes to the House from the client portal chooses the world it is about. That conversation reaches the Founder, and also the team lead of that world, under Client requests: the Film team lead sees Film and nothing else; a lead for every world sees every world's. A team lead reads it, takes it up, and replies in the House's name; the record keeps who wrote it and the Founder is told. Anything about money (a proposal, licensing) reaches the Founder only. Closing a conversation is the Founder's."],
  ["Email from the House", "When the House's mail is on, you are sent one line when work is returned to you, decided, handed to your service, or assigned to you. The email never carries the work: it points you to this desk. Your account page lists what was sent."],
  ["When something cannot be read", "The page says so and shows nothing in its place. Try again; if it continues, tell the House."]
];

    CFG = embeddedConfig();
